[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "crm-cosmology"
version = "1.3.2"
description = "Curvature Relaxation Model (CRM) - Geometric Cosmology & Modified Gravity Research Codebase"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "CC-BY-4.0"}
license-files = ["LICENSE", "NOTICE", "THIRD_PARTY_LICENSES.md"]
authors = [
    {name = "Research Line", email = "open-science@research-line.org"}
]
keywords = [
    "cosmology",
    "modified-gravity",
    "fR-gravity",
    "horndeski",
    "dark-matter-alternative",
    "mcmc",
    "planck-cmb",
    "sparc",
    "open-science"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Scientific/Engineering :: Astronomy",
    "License :: OSI Approved :: Creative Commons Attribution 4.0 International License (CC BY 4.0)",
    "Operating System :: OS Independent",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13"
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "matplotlib>=3.7",
    "emcee>=3.1"
]

[project.urls]
Homepage = "https://github.com/research-line/crm-cosmology"
Repository = "https://github.com/research-line/crm-cosmology.git"
Documentation = "https://github.com/research-line/crm-cosmology#readme"
"Bug Tracker" = "https://github.com/research-line/crm-cosmology/issues"
Changelog = "https://github.com/research-line/crm-cosmology/blob/main/CHANGELOG.md"
Security = "https://github.com/research-line/crm-cosmology/blob/main/SECURITY.md"
"Parent Organization" = "https://github.com/research-line"
"Umbrella Ecosystem" = "https://github.com/open-bricks"
"Third-Party Licenses" = "https://github.com/research-line/crm-cosmology/blob/main/THIRD_PARTY_LICENSES.md"
"Marketing Log" = "https://github.com/research-line/crm-cosmology/blob/main/MARKETING-LOG.txt"
"LLM Ready" = "https://github.com/research-line/crm-cosmology/blob/main/llms.txt"
"Zenodo DOI" = "https://doi.org/10.5281/zenodo.19233559"

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -v"
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["."]
norecursedirs = [
    ".git",
    ".pytest_cache",
    ".ruff_cache",
    "build",
    "dist",
    ".venv",
    "venv",
    ".eggs",
    "*.egg-info",
    "data/raw",
    "_archive"
]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "B", "SIM", "C4", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"scripts/**" = ["ALL"]
"tests/**" = ["E501"]
